services:
  - type: web
    name: achol-fashion-store
    env: python
    plan: free
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,akd-fashion-design.onrender.com,akd.com,www.akd.com,akd-fashion-design.com"
      - key: DATABASE_URL
        sync: false # Requires Neon Postgres string
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Requires Cloudinary keys
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_EMAIL
        value: "admin@example.com"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEBUG
        value: "False"

{% load static %}

<!-- Add to Cart Modal -->
<div id="add-to-cart-modal" class="hidden fixed inset-0 z-50 overflow-y-auto">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black bg-opacity-50 transition-opacity" onclick="closeAddToCartModal()"></div>
    
    <!-- Modal Content -->
    <div class="flex items-end sm:items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div class="relative inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
            <!-- Header -->
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="text-lg font-bold text-gray-900">Add to Cart</h3>
                <button onclick="closeAddToCartModal()" class="text-gray-400 hover:text-gray-600 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Body -->
            <div class="px-6 py-6">
                <form id="add-to-cart-form" method="post" class="space-y-6">
                    {% csrf_token %}
                    
                    <!-- Product Display -->
                    <div id="product-info" class="flex items-start gap-4">
                        <div class="w-20 h-20 bg-gray-100 rounded-lg flex items-center justify-center overflow-hidden flex-shrink-0">
                            <img id="modal-product-image" src="" alt="" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1">
                            <h4 id="modal-product-name" class="font-bold text-gray-900 mb-1"></h4>
                            <p id="modal-product-price" class="text-lg font-black text-indigo-600"></p>
                            <p id="modal-product-stock" class="text-xs text-gray-500 mt-1 font-medium"></p>
                        </div>
                    </div>

                    <!-- Quantity Selector -->
                    <div>
                        <label for="quantity" class="block text-sm font-semibold text-gray-700 mb-2">Quantity</label>
                        <div class="flex items-center gap-3">
                            <button type="button" onclick="decreaseQuantity()" class="w-10 h-10 rounded-lg border border-gray-200 flex items-center justify-center hover:bg-gray-50 transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                                </svg>
                            </button>
                            <input type="number" id="quantity" name="quantity" value="1" min="1" class="w-16 px-3 py-2 border border-gray-200 rounded-lg text-center font-semibold focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                            <button type="button" onclick="increaseQuantity()" class="w-10 h-10 rounded-lg border border-gray-200 flex items-center justify-center hover:bg-gray-50 transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                </svg>
                            </button>
                        </div>
                        <p id="stock-warning" class="text-xs text-red-500 mt-1 hidden">Limited stock available</p>
                    </div>

                    <!-- Total Price -->
                    <div class="bg-gray-50 rounded-lg p-4 flex items-center justify-between">
                        <span class="text-sm font-medium text-gray-700">Subtotal</span>
                        <span id="modal-total-price" class="text-lg font-black text-indigo-600"></span>
                    </div>

                    <!-- Notes (Optional) -->
                    <div>
                        <label for="notes" class="block text-sm font-semibold text-gray-700 mb-2">Special Instructions (Optional)</label>
                        <textarea id="notes" name="notes" rows="2" placeholder="Add any special requests..." class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"></textarea>
                    </div>
                </form>
            </div>

            <!-- Footer -->
            <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex items-center gap-3">
                <button onclick="closeAddToCartModal()" class="flex-1 px-4 py-2.5 border border-gray-200 rounded-lg text-sm font-semibold text-gray-700 bg-white hover:bg-gray-50 transition">
                    Cancel
                </button>
                <button onclick="submitAddToCart()" class="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 transition flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Add to Cart
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function openAddToCartModal(productData) {
    const modal = document.getElementById('add-to-cart-modal');
    
    // Set product data
    document.getElementById('modal-product-image').src = productData.image;
    document.getElementById('modal-product-name').textContent = productData.name;
    document.getElementById('modal-product-price').textContent = '$' + productData.price;
    document.getElementById('modal-product-stock').textContent = productData.stock + ' in stock';
    
    // Set max quantity
    document.getElementById('quantity').max = productData.stock;
    document.getElementById('quantity').value = 1;
    
    // Store product ID for submission
    document.getElementById('add-to-cart-form').dataset.productId = productData.id;
    
    // Update total
    updateModalTotal(productData.price);
    
    // Show modal
    modal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}

function closeAddToCartModal() {
    const modal = document.getElementById('add-to-cart-modal');
    modal.classList.add('hidden');
    document.body.style.overflow = 'auto';
}

function increaseQuantity() {
    const input = document.getElementById('quantity');
    const max = parseInt(input.max);
    if (parseInt(input.value) < max) {
        input.value = parseInt(input.value) + 1;
        updateModalTotal();
    }
}

function decreaseQuantity() {
    const input = document.getElementById('quantity');
    if (parseInt(input.value) > 1) {
        input.value = parseInt(input.value) - 1;
        updateModalTotal();
    }
}

function updateModalTotal(price = null) {
    const quantity = parseInt(document.getElementById('quantity').value);
    const form = document.getElementById('add-to-cart-form');
    const productPrice = price || parseFloat(form.dataset.productPrice || form.dataset.price);
    const total = quantity * productPrice;
    document.getElementById('modal-total-price').textContent = '$' + total.toFixed(2);
}

function submitAddToCart() {
    const form = document.getElementById('add-to-cart-form');
    const productId = form.dataset.productId;
    const quantity = document.getElementById('quantity').value;
    const notes = document.getElementById('notes').value;
    
    // Submit form via AJAX or regular form submission
    fetch('{% url "cart:add_to_cart" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: new URLSearchParams({
            'product_id': productId,
            'quantity': quantity,
            'notes': notes
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            closeAddToCartModal();
            // Show success message
            alert('Product added to cart!');
            // Optionally refresh cart count
            if (data.cart_count !== undefined) {
                updateCartBadge(data.cart_count);
            }
        } else {
            alert('Error: ' + (data.message || 'Failed to add to cart'));
        }
    })
    .catch(error => console.error('Error:', error));
}

// Close modal on Escape key
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closeAddToCartModal();
    }
});
</script>

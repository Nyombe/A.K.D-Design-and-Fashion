{% extends "base/base.html" %}
{% load static %}

{% block title %}Reset Email Sent | Achol Fashion Store{% endblock %}

{% block content %}
<section class="py-20 bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center">
    <div class="container mx-auto px-4">
        <div class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700 p-12 text-center">
            <div class="w-20 h-20 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-full flex items-center justify-center mx-auto mb-8">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
            </div>
            
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-4">Check Your Inbox</h1>
            <p class="text-gray-600 dark:text-gray-400 mb-8">
                We've sent a password reset link to your email address. Please check your inbox and spam folder.
            </p>

            <a href="{% url 'auth:login' %}" 
               class="inline-block w-full py-4 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-xl shadow-lg transition-all duration-300">
                Back to Login
            </a>
        </div>
    </div>
</section>
{% endblock %}
